default: auto
providers:
  openai_responses:
    type: openai_responses_compatible
    enabled_env: CONSENSUS_LLM_ENABLED
    api_key_envs:
      - OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    model_envs:
      - OPENAI_MODEL
    timeout_seconds: 30
    max_tokens: 700
    max_retries: 1
    authority: advisory_only
  openai_chat:
    type: openai_chat_completions_compatible
    enabled_env: CONSENSUS_LLM_ENABLED
    api_key_envs:
      - OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    model_envs:
      - OPENAI_MODEL
    timeout_seconds: 30
    max_tokens: 700
    max_retries: 1
    authority: advisory_only
  anthropic:
    type: anthropic_messages_compatible
    enabled_env: CONSENSUS_LLM_ENABLED
    api_key_envs:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_AUTH_TOKEN
    base_url_env: ANTHROPIC_BASE_URL
    model_envs:
      - ANTHROPIC_MODEL
      - ANTHROPIC_DEFAULT_SONNET_MODEL
    timeout_seconds: 30
    max_tokens: 700
    max_retries: 1
    authority: advisory_only
