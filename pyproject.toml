[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-consensus"
version = "0.22.3"
description = "A local-first control plane for evidence-backed agentic code changes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://tianfuwang.tech/AgenticConsensus/"
Repository = "https://github.com/GeminiLight/AgenticConsensus"
Issues = "https://github.com/GeminiLight/AgenticConsensus/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
]

[project.scripts]
agentic-consensus = "system.main:main"
agentic-consensus-check = "system.check:main"

[tool.vercel]
entrypoint = "system.web.app:app"

[tool.hatch.build.targets.wheel]
packages = ["system"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
